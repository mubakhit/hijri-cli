[project]
name = "hijri-cli"
version = "0.1.0"
description = "Hijri (Umm al-Qura) date command for the terminal: print today's Hijri date or convert between Hijri and Gregorian."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Muhammad Bakhit" }]
license-files = ["LICENSE.txt", "LICENSE-ar.txt", "hijridate-LICENSE.txt"]
keywords = ["hijri", "umm al-qura", "islamic calendar", "date", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/mubakhit/hijri-cli"
Issues = "https://github.com/mubakhit/hijri-cli/issues"

[project.scripts]
hijri = "cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "hijra", "hijra_uq"]